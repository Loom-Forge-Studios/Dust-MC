[package]
name = "dust-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# The operator-facing program is `dust`, not `dust-server`: subcommands read
# as `dust server …`, matching the grammar in `cli`. The library stays the
# thing other crates build on; the binary is a thin shell over it.
[[bin]]
name = "dust"
path = "src/main.rs"

[dependencies]
ctrlc.workspace = true
dust-config.workspace = true
dust-gen.workspace = true
# The rules a client's claim is checked against; see src/net/session.rs.
dust-guard.workspace = true
# The game's rules about which state a placed block takes; see src/net/session.rs.
dust-sim.workspace = true
# The `tls` feature is on because online mode needs it: verifying a player
# against Mojang means a real HTTPS request, and a server that silently ran
# offline because the feature was off would let anybody join as anybody. See
# the online-mode handling in `net::session`.
dust-net = { workspace = true, features = ["tls"] }
dust-protocol.workspace = true
dust-registry.workspace = true
dust-world.workspace = true

# Reading the chunk NBT of a world on disk; see src/net/source.rs.
dust-nbt.workspace = true

# The save file. JSON because it is already in this workspace's dependency
# graph and its licence audit, and because a save an operator can open in an
# editor is one they can repair; see src/net/save.rs for what is in it.
serde = { workspace = true }
serde_json.workspace = true

# The network runtime. dust-net picked tokio and explains why in its own
# manifest; this crate takes the same one because a second runtime in one
# process is two schedulers competing for the same cores.
tokio = { version = "1", default-features = false, features = [
    "io-util",
    "macros",
    "net",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
] }

[lints]
workspace = true

[dev-dependencies]
# The property-resolution test asks the registry directly for the states it
# expects, rather than trusting the resolver to agree with itself.
dust-registry.workspace = true
dust-world.workspace = true
# The protocol test decompresses frames itself rather than through dust-net's
# codec. Sharing the server's decoder would make the test agree with the server
# by construction, which is the thing that test exists not to do — and the
# registry sync is the first packet in this project big enough to actually
# cross the compression threshold, so a test that could only read uncompressed
# frames could not read the packets that matter.
flate2.workspace = true

[[bench]]
name = "movement"
harness = false

[[bench]]
name = "items"
harness = false

[[bench]]
name = "join"
harness = false

[[bench]]
name = "contention"
harness = false

[[bench]]
name = "furnaces"
harness = false

[[bench]]
name = "updates"
harness = false

[[bench]]
name = "daylight"
harness = false
